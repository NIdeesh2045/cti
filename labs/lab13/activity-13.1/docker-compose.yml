services:
  mongo1:
    image: mongo:7.0
    container_name: lab13-mongo1
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile", "--bind_ip_all"]
    ports:
      - "27317:27017"
    volumes:
      - ./keyfile:/etc/mongo-keyfile:ro
      - mongo1_data:/data/db
    networks:
      - lab13-network

  mongo2:
    image: mongo:7.0
    container_name: lab13-mongo2
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile", "--bind_ip_all"]
    ports:
      - "27318:27017"
    volumes:
      - ./keyfile:/etc/mongo-keyfile:ro
      - mongo2_data:/data/db
    networks:
      - lab13-network

  mongo3:
    image: mongo:7.0
    container_name: lab13-mongo3
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/etc/mongo-keyfile", "--bind_ip_all"]
    ports:
      - "27319:27017"
    volumes:
      - ./keyfile:/etc/mongo-keyfile:ro
      - mongo3_data:/data/db
    networks:
      - lab13-network

  prometheus-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: lab13-mongodb-exporter
    command:
      - "--mongodb.uri=mongodb://mongo1:27017"
      - "--discovering-mode"
    ports:
      - "29215:9216"
    depends_on:
      - mongo1
    networks:
      - lab13-network

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  lab13-network:
    driver: bridge
