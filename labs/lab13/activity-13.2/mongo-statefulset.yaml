apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      initContainers:
        - name: setup-keyfile
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /key-source/keyfile /key-dest/keyfile && chown 999:999 /key-dest/keyfile && chmod 400 /key-dest/keyfile
          volumeMounts:
            - name: key-source
              mountPath: /key-source
              readOnly: true
            - name: key-dest
              mountPath: /key-dest
      containers:
        - name: mongodb
          image: mongo:7.0
          command:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongo-keyfile/keyfile
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: key-dest
              mountPath: /etc/mongo-keyfile
      volumes:
        - name: key-source
          secret:
            secretName: mongo-keyfile
        - name: key-dest
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
