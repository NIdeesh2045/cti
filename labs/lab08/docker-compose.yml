services:
  mongo1:
    image: mongo:7.0
    container_name: lab08-mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27117:27017"
    volumes:
      - mongo1_data:/data/db
    restart: unless-stopped

  mongo2:
    image: mongo:7.0
    container_name: lab08-mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27118:27017"
    volumes:
      - mongo2_data:/data/db
    restart: unless-stopped

  mongo3:
    image: mongo:7.0
    container_name: lab08-mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27119:27017"
    volumes:
      - mongo3_data:/data/db
    restart: unless-stopped

  arbiter:
    image: mongo:7.0
    container_name: lab08-arbiter
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27120:27017"
    volumes:
      - arbiter_data:/data/db
    restart: unless-stopped

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  arbiter_data:
